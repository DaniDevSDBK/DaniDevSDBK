<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="grid1en" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18202a" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .step { fill: #11161d; stroke: #28313d; stroke-width: 1; }
    .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .accent { fill: #77E3C0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
    .blue { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
    .h3 { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .txt { fill: #9da7b3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; }
    .mono { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .tag { fill: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; }

    .b1 { opacity: 0.22; animation: show1en 0.45s ease-out 0.2s forwards; }
    .b2 { opacity: 0.22; animation: show1en 0.45s ease-out 0.85s forwards; }
    .b3 { opacity: 0.22; animation: show1en 0.45s ease-out 1.5s forwards; }
    .b4 { opacity: 0.22; animation: show1en 0.45s ease-out 2.15s forwards; }
    @keyframes show1en {
      to { opacity: 1; }
    }

    .cur1 { animation: c1en 3.6s cubic-bezier(0.22,1,0.36,1) forwards; }
    .cur2 { animation: c2en 3.8s cubic-bezier(0.22,1,0.36,1) forwards; }
    .cur3 { animation: c3en 4.0s cubic-bezier(0.22,1,0.36,1) forwards; }

    @keyframes c1en {
      0% { transform: translate(75px, 52px); }
      35% { transform: translate(340px, 78px); }
      70% { transform: translate(210px, 220px); }
      100% { transform: translate(405px, 255px); }
    }
    @keyframes c2en {
      0% { transform: translate(760px, 58px); }
      40% { transform: translate(620px, 125px); }
      75% { transform: translate(640px, 230px); }
      100% { transform: translate(815px, 265px); }
    }
    @keyframes c3en {
      0% { transform: translate(120px, 355px); }
      45% { transform: translate(360px, 335px); }
      85% { transform: translate(620px, 335px); }
      100% { transform: translate(815px, 355px); }
    }
  </style>

  <rect class="bg" x="1" y="1" width="878" height="408" rx="12"/>
  <rect x="2" y="2" width="876" height="406" rx="11" fill="url(#grid1en)"/>

  <circle cx="22" cy="20" r="4.5" fill="#ff5f56"/><circle cx="38" cy="20" r="4.5" fill="#ffbd2e"/><circle cx="54" cy="20" r="4.5" fill="#27c93f"/>
  <text x="74" y="24" class="mono">01 · identity-and-delivery.canvas — C# · .NET · SQL Server · Azure · ERP &amp; B2B</text>

  <g class="b1">
    <rect x="28" y="42" width="824" height="134" rx="9" class="card" stroke="#58a6ff" stroke-dasharray="4 3"/>
    <text x="48" y="74" class="title">DaniDev</text>
    <text x="165" y="74" class="accent">· Software Developer (.NET · APIs · ERP · B2B)</text>
    <text x="48" y="100" class="txt">Building business software that connects workflows, data, and systems. Professional experience since 2023</text>
    <text x="48" y="120" class="txt">across production ERP systems, standalone B2B apps, integrations (APIs, OAuth 2.0, XML, SQL), and live support.</text>
    <text x="48" y="152" class="blue">2023: Production &amp; support  ·  2024–25: Feature ownership, integrations &amp; B2B  ·  2026: Code review, releases &amp; automation</text>
  </g>

  <g class="b2">
    <rect x="28" y="190" width="404" height="110" rx="9" class="card"/>
    <text x="46" y="214" class="h3">End-to-end delivery scope</text>
    <text x="46" y="236" class="txt">• Analyze domain rules, design API/data contracts, and implement</text>
    <text x="46" y="256" class="txt">• Validate behavior, ship releases, and follow up on live issues</text>
    <text x="46" y="280" class="accent">Flow: business rules → code &amp; data → release &amp; support</text>
  </g>

  <g class="b3">
    <rect x="448" y="190" width="404" height="110" rx="9" class="card"/>
    <text x="466" y="214" class="h3">Three core pillars</text>
    <text x="466" y="236" class="txt">01 · Product: ERP and B2B software used in real daily operations</text>
    <text x="466" y="256" class="txt">02 · Integration: APIs, data exchange, auth, and system flows</text>
    <text x="466" y="278" class="txt">03 · Reliability: support, concurrency, persistence, and CI</text>
  </g>

  <g class="b4">
    <rect x="28" y="314" width="194" height="72" rx="8" class="step"/>
    <text x="42" y="338" class="accent">01 · UNDERSTAND</text>
    <text x="42" y="360" class="txt">Domain · rules · impact</text>

    <rect x="238" y="314" width="194" height="72" rx="8" class="step"/>
    <text x="252" y="338" class="blue">02 · DESIGN</text>
    <text x="252" y="360" class="txt">API · data · compatibility</text>

    <rect x="448" y="314" width="194" height="72" rx="8" class="step"/>
    <text x="462" y="338" class="accent">03 · IMPLEMENT</text>
    <text x="462" y="360" class="txt">C# · .NET · SQL Server</text>

    <rect x="658" y="314" width="194" height="72" rx="8" class="step"/>
    <text x="672" y="338" class="blue">04 · VERIFY &amp; SHIP</text>
    <text x="672" y="360" class="txt">Tests · review · release</text>
  </g>

  <g class="cur1">
    <path d="M0 0 L0 16 L4.5 12.5 L8 20 L10.5 18.5 L7 11 L12.5 11 Z" fill="#58a6ff"/>
    <rect x="11" y="13" width="52" height="16" rx="4" fill="#58a6ff"/>
    <text x="17" y="24" class="tag">Product</text>
  </g>
  <g class="cur2">
    <path d="M0 0 L0 16 L4.5 12.5 L8 20 L10.5 18.5 L7 11 L12.5 11 Z" fill="#77E3C0"/>
    <rect x="11" y="13" width="44" height="16" rx="4" fill="#77E3C0"/>
    <text x="17" y="24" class="tag">.NET</text>
  </g>
  <g class="cur3">
    <path d="M0 0 L0 16 L4.5 12.5 L8 20 L10.5 18.5 L7 11 L12.5 11 Z" fill="#d2a8ff"/>
    <rect x="11" y="13" width="42" height="16" rx="4" fill="#d2a8ff"/>
    <text x="17" y="24" class="tag">Data</text>
  </g>
</svg>
